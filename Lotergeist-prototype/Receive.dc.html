body{margin:0;background:#F7F7FA}
.lg{--bg:#F7F7FA;--surface:#FFFFFF;--surface-2:#FAFAFC;--sunken:#F1F1F5;--border:#E7E7EE;--border-strong:#D7D8E2;--text:#16161D;--muted:#5F6170;--subtle:#6B6D7B;--accent:#6D4AFF;--accent-hover:#5B3BE8;--on-accent:#FFFFFF;--accent-soft:#F1EDFF;--accent-text:#5B3BE8;--danger:#D92D20;--danger-soft:#FEF0EE;--danger-text:#B42318;--warn:#F79009;--warn-soft:#FFF6E5;--warn-text:#B54708;--ok:#12B76A;--ok-soft:#ECFDF3;--ok-text:#067647;--info:#2E90FA;--info-soft:#EFF6FF;--info-text:#175CD3;--shadow:0 1px 2px rgba(16,16,29,.04),0 2px 8px rgba(16,16,29,.04);--shadow-lg:0 12px 32px rgba(16,16,29,.10);--ring:0 0 0 3px rgba(109,74,255,.22);min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;font-feature-settings:'cv11','ss01';-webkit-font-smoothing:antialiased;display:flex;flex-wrap:wrap;transition:background-color .3s,color .3s}

.lg *{box-sizing:border-box}
.lg a{color:var(--accent-text)}
.lg button{font:inherit;cursor:pointer}
.lg :focus-visible{outline:none;box-shadow:var(--ring)}
.side{flex:1 1 248px;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;gap:18px;transition:background-color .3s,border-color .3s}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px;text-decoration:none;color:var(--text)!important}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--subtle);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;transition:background-color .15s,color .15s}
.nav a:hover{background:var(--sunken);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-text)}
.nav svg{width:18px;height:18px;flex-shrink:0}
.count{margin-left:auto;font-size:11px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:var(--sunken);color:var(--muted)}
.count.red{background:var(--danger);color:#fff}.count.amber{background:var(--warn);color:#1F1405}
.theme{display:flex;padding:3px;border-radius:10px;background:var(--sunken);border:1px solid var(--border)}
.theme button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:32px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:13px;font-weight:500;transition:all .2s}
.theme button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;border:1px solid var(--border)}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent-text);flex-shrink:0}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--surface);transition:background-color .3s,border-color .3s}
.crumb{font-size:13px;color:var(--subtle)}
.h1{margin:2px 0 0;font-size:24px;font-weight:600;letter-spacing:-.02em}
.page{padding:28px 32px 64px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start;width:100%;max-width:1320px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);transition:background-color .3s,border-color .3s,box-shadow .2s,transform .2s}
.pad{padding:22px}
.h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
.sub{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.label{font-size:12px;font-weight:500;color:var(--subtle)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text)!important;font-size:14px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background-color .15s,border-color .15s,transform .1s,box-shadow .15s}
.btn:hover{background:var(--sunken)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)!important;box-shadow:0 1px 2px rgba(16,16,29,.12)}

.chip.ok,.ico.ok{background:var(--ok-soft);color:var(--ok-text)}.chip.warn,.ico.warn{background:var(--warn-soft);color:var(--warn-text)}.chip.bad{background:var(--danger-soft);color:var(--danger-text)}.chip.info,.ico.info{background:var(--info-soft);color:var(--info-text)}.chip.accent,.ico.accent{background:var(--accent-soft);color:var(--accent-text)}

.mono{font-family:'JetBrains Mono',monospace;font-size:13px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--border);border-top:1px solid var(--border)}
.kv>div{background:var(--surface);padding:14px 20px;transition:background-color .3s}

.loc.ctrl{border-color:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.line{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;transition:background-color .2s}
.line.now{background:var(--accent-soft)}
.prog{height:8px;border-radius:999px;background:var(--sunken);overflow:hidden}
.prog>span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.enter{animation:rise .35s cubic-bezier(.2,.8,.2,1) both}

@keyframes sweep{0%{top:12%}50%{top:84%}100%{top:12%}}
.laser{animation:sweep 2.6s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.lg *{animation:none!important;transition:none!important}}

<div style="flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 6px">

</template>
</dl>
</div>

<div style="display: flex; gap: 10px; flex-wrap: wrap">

</div>
</template>

<span class="ico ok" style="width: 52px; height: 52px; background: var(--surface)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>

<p class="sub" style="font-size: 15px">38 packages · every lot and serial recorded · transaction info stored for 6 years · 0 discrepancies.</p>
<div style="display: flex; gap: 10px; flex-wrap: wrap"><a href="Inventory.dc.html" class="btn primary big">View in inventory</a><button class="btn big" onClick="{{reset}}">Replay demo</button></div>
</div>
</template>
</section>

<aside class="card" aria-labelledby="inv" style="flex: 1 1 360px; min-width: 0; padding: 18px; display: flex; flex-direction: column; gap: 10px">

</template>
</ul>
</aside>
</main>
</div>
</div>

    ];
    var lines = base.map(function (l) { return Object.assign({ st: 'done' }, l); });
    items.forEach(function (t, k) { lines.push({ name: t.name.split(',')[0], sub: k < i ? ('Lot ' + t.fields[1].v + ' · ' + t.loc) : (k === i ? 'Scanning now' : 'Waiting for scan'), qty: (k < i ? '1' : '0') + '/1', st: k < i ? 'done' : (k === i ? 'now' : 'todo') }); });
    lines = lines.map(function (l) {
      return Object.assign({}, l, { cls: 'line' + (l.st === 'now' ? ' now' : ''), mark: l.st === 'done' ? '✓' : (l.st === 'now' ? '•' : ''), icon: 'ico' + (l.st === 'done' ? ' ok' : (l.st === 'now' ? ' accent' : '')) });
    });
    var doneCount = 35 + Math.min(i, 3);
    return {
      it: it, dm: dm, lines: lines, done: done, notDone: !done, doneCount: doneCount,
      locCls: 'loc' + it.kind,
      progStyle: 'width: ' + Math.round(doneCount / 38 * 100) + '%',
      next: function () { self.setState({ i: i + 1 }); },
      reset: function () { self.setState({ i: 0 }); },
      theme: theme, isLight: theme === 'light' ? 'true' : 'false', isDark: theme === 'dark' ? 'true' : 'false',
      toLight: function () { setT('light'); }, toDark: function () { setT('dark'); }
    };
  }
}
</script>
