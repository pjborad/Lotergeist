name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PHI guard (SAFE-2)
        run: bash scripts/phi-guard.sh --all
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: packages/grave-robber
      - run: pnpm seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:web
